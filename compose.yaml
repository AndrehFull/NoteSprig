services:
  notesprig:
    # Prebuilt, CI-tested image (amd64 and arm64). Pin a release with NOTESPRIG_VERSION in .env.
    # To build from this checkout instead, run `docker compose up -d --build`.
    image: ghcr.io/andrehfull/notesprig:${NOTESPRIG_VERSION:-latest}
    build: .
    container_name: notesprig
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4317
      TRUST_PROXY: "1"
      NOTESPRIG_VAULT: /data/vault
      # Optional. Without them, NoteSprig prints a one-time setup code in its log; create the
      # password in the browser. Generated credentials are stored in /data/notesprig-auth.json.
      NOTESPRIG_PASSWORD_HASH: ${NOTESPRIG_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:4317:4317"
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "fetch('http://127.0.0.1:4317/api/session').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
