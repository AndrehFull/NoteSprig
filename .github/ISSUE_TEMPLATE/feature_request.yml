name: Feature request
description: Describe a workflow that NoteSprig could improve.
body:
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to do?
      description: Explain the workflow and its current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome you would find useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or related approaches.
