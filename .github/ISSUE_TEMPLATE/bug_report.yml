name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: |
        Please remove private notes, credentials, cookies, and tokens. For vulnerabilities, follow SECURITY.md instead of publishing exploit details here.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal example with synthetic notes or files.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App version or commit, browser, operating system, and development or Docker setup.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Optional, with sensitive data removed.
