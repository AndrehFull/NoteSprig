name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check documentation and dependency notices
        run: |
          npm run check:docs
          npm run check:i18n
          npm run notices:check
      - name: Install test browser
        run: npx playwright install --with-deps chrome
      - name: Build and test
        run: npm run test:ui
      - name: Build Docker image
        run: docker build -t notesprig:ci .
      - name: Check Docker runtime and backup restoration
        run: node tests/container-smoke.mjs notesprig:ci
      - name: Save synthetic test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
